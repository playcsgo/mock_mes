<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Line Monitor</title>
<style>
  :root {
    --bg: #14171a; --panel: #1d2125; --line: #2c3238; --text: #d9dee3;
    --muted: #7d8791; --ok: #3ecf6e; --warn: #f2b33d; --bad: #ef5350;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { position: relative; display: flex; align-items: baseline; gap: 16px; padding: 18px 24px;
           border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  #conn { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  #lang { margin-left: auto; font-size: 13px; color: var(--muted); text-decoration: none;
          border: 1px solid var(--line); padding: 4px 10px;
          white-space: nowrap; flex-shrink: 0; }
  #lang:hover { color: var(--text); border-color: var(--muted); }
  #lang:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  #join-btn:not([hidden]) + #lang { margin-left: 0; }
  #join-btn { margin-left: auto; font: inherit; font-size: 13px; color: var(--muted);
              background: none; border: 1px solid var(--line); padding: 4px 10px;
              white-space: nowrap; flex-shrink: 0; cursor: pointer; }
  #join-btn[hidden] { display: none; }
  #join-btn:hover, #join-btn[aria-expanded="true"] { color: var(--text); border-color: var(--muted); }
  #join-btn:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  #join-card { position: absolute; top: 100%; right: 24px; z-index: 5; margin-top: 8px;
               width: 300px; max-width: calc(100vw - 32px); padding: 14px;
               background: var(--panel); border: 1px solid var(--line);
               display: flex; gap: 14px; align-items: center; }
  #join-card[hidden] { display: none; }
  @media (max-width: 600px) {
    header { flex-wrap: wrap; row-gap: 8px; }
    header h1 { flex: 1 0 100%; }
  }
  #join-card .qr { flex: none; width: 104px; height: 104px; background: #fff; }
  #join-card .qr img { display: block; width: 100%; height: 100%; }
  #join-card p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  #join-card a { font-family: var(--mono); font-size: 13px; color: var(--ok); }
  #conn.on::before  { content: "● "; color: var(--ok); }
  #conn.off::before { content: "● "; color: var(--bad); }
  main { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; padding: 20px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: var(--muted); }

  #stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--muted);
          padding: 12px 14px; }
  .tile.ok   { border-top-color: var(--ok); }
  .tile.warn { border-top-color: var(--warn); }
  .tile.bad  { border-top-color: var(--bad); }
  .tile .name { font-family: var(--mono); color: var(--muted); }
  .tile .rate { font-family: var(--mono); font-size: 40px; font-weight: 700; line-height: 1.1; }
  .tile.bad .rate.recent { color: var(--bad); }
  .tile .rate.total { font-size: 26px; font-weight: 600; }
  .tile .label { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .tile .label.split { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  .tile .count { font-family: var(--mono); font-size: 13px; color: var(--muted); }

  section + section { margin-top: 24px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; }
  td, th { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  #feed { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 13px;
          max-height: 70vh; overflow-y: auto; }
  #feed li { padding: 4px 8px; border-bottom: 1px solid var(--line); }
  #feed li.fail { color: var(--bad); }

  #wake { position: fixed; inset: 0; z-index: 9; background: var(--bg);
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 14px; text-align: center; padding: 24px; }
  #wake h2 { margin: 0; font-size: 18px; color: var(--text); }
  #wake p { margin: 0; color: var(--muted); max-width: 420px; }
  #wake .bar { width: min(320px, 80vw); height: 4px; background: var(--line); overflow: hidden; }
  #wake .bar i { display: block; height: 100%; width: 40%; background: var(--ok);
                 animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  #wake .sec { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  #alerts { list-style: none; margin: 0 0 24px; padding: 0;
            max-height: 132px; overflow-y: auto; }
  #alerts:empty { display: none; }
  #alerts li { background: #3a1d1f; border-left: 4px solid var(--bad); color: #ffd6d6;
               padding: 8px 12px; margin-bottom: 6px; font-family: var(--mono); font-size: 14px; }
  #alerts li.new { animation: flash 1s 3; }
  #alerts li.acked { background: #1d2f24; border-left-color: var(--ok); color: #c8f0d4; }
  @keyframes flash { 50% { background: #6b2226; } }
</style>
</head>
<body>
<div id="wake">
  <h2 data-t="waking"></h2>
  <div class="bar"><i></i></div>
  <p data-t="wakeNote"></p>
  <div class="sec"><span data-t="waited"></span> <span id="wake-sec">0</span> <span data-t="seconds"></span></div>
</div>
<header>
  <h1 data-t="title"></h1>
  <span id="conn" class="off" data-t="offline"></span>
  <button id="join-btn" type="button" aria-expanded="false" aria-controls="join-card" data-t="join" hidden></button>
  <a id="lang"></a>
  <div id="join-card" hidden role="dialog">
    <div class="qr"><img id="join-qr" alt="LINE QR code" width="104" height="104"></div>
    <div>
      <p data-t="joinNote"></p>
      <a id="join-link" target="_blank" rel="noopener"></a>
    </div>
  </div>
</header>

<main>
  <div>
    <ul id="alerts"></ul>
    <section>
      <h2 data-t="yieldHead"></h2>
      <div id="stations"></div>
    </section>
    <section>
      <h2 data-t="failHead"></h2>
      <table>
        <thead><tr><th data-t="colStation"></th><th data-t="colCode"></th><th data-t="colCount"></th></tr></thead>
        <tbody id="failures"></tbody>
      </table>
    </section>
  </div>
  <section>
    <h2 data-t="feedHead"></h2>
    <ul id="feed"></ul>
  </section>
</main>

<script>
const LANG = location.pathname.endsWith("/en") ? "en" : "zh";
const LOCALE = LANG === "en" ? "en-US" : "zh-TW";

const TEXT = {
  zh: {
    pageTitle: "Line Monitor — 產線看板",
    title: "產線測試即時看板",
    online: "即時連線中",
    offline: "未連線",
    reconnecting: "斷線，重新連線中…",
    yieldHead: "各站良率（即時更新）",
    totalLabel: "總良率（最近一週）",
    recentLabel: (n) => `最近 ${n} 筆`,
    failHead: "最常見失敗原因（最近一週，每 30 秒更新）",
    feedHead: "即時測試紀錄",
    colStation: "站",
    colCode: "失敗代碼",
    colCount: "次數",
    waking: "正在喚醒伺服器…",
    wakeNote: "這個 demo 跑在免費方案上，沒人使用時會自動休眠以節省資源。第一次開啟大約需要一分鐘。",
    waited: "已等待",
    seconds: "秒",
    join: "加入 LINE 告警",
    joinNote: "用 LINE 掃描，或點下方連結。加入後會收到良率告警，也能直接認領。",
    other: "English",
    alert: (time, station, rate, th) =>
      `⚠ ${time}  ${station} 良率 ${rate}%，低於門檻 ${th}%`,
    acked: (name) => `　✔ 已由 ${name} 處理`,
  },
  en: {
    pageTitle: "Line Monitor — Production Dashboard",
    title: "Production Test Monitor",
    online: "Live",
    offline: "Not connected",
    reconnecting: "Disconnected, reconnecting…",
    yieldHead: "Yield by station (live)",
    totalLabel: "Overall (last 7 days)",
    recentLabel: (n) => `Last ${n} results`,
    failHead: "Top failure codes (last 7 days, refreshed every 30s)",
    feedHead: "Live test results",
    colStation: "Station",
    colCode: "Fail code",
    colCount: "Count",
    waking: "Waking the server…",
    wakeNote: "This demo runs on a free plan and sleeps when nobody is using it. The first visit takes about a minute.",
    waited: "Waited",
    seconds: "s",
    join: "Join LINE alerts",
    joinNote: "Scan with LINE or open the link. You'll get yield alerts and can claim them in chat.",
    other: "中文",
    alert: (time, station, rate, th) =>
      `⚠ ${time}  ${station} yield ${rate}%, below the ${th}% threshold`,
    acked: (name) => `  ✔ handled by ${name}`,
  },
};

const T = TEXT[LANG];

document.documentElement.lang = LANG === "en" ? "en" : "zh-Hant";
document.title = T.pageTitle;
for (const el of document.querySelectorAll("[data-t]")) {
  el.textContent = T[el.dataset.t];
}

const langLink = document.getElementById("lang");
langLink.textContent = T.other;
langLink.href = LANG === "en" ? "cn" : "en";
langLink.hreflang = LANG === "en" ? "zh-Hant" : "en";

const joinBtn = document.getElementById("join-btn");
const joinCard = document.getElementById("join-card");
joinCard.setAttribute("aria-label", T.join);
function setJoin(open) {
  joinCard.hidden = !open;
  joinBtn.setAttribute("aria-expanded", String(open));
}
joinBtn.addEventListener("click", () => setJoin(joinCard.hidden));
document.addEventListener("click", (e) => {
  if (!joinCard.hidden && !joinCard.contains(e.target) && !joinBtn.contains(e.target)) setJoin(false);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !joinCard.hidden) { setJoin(false); joinBtn.focus(); }
});

let stations = {};
const RECENT_N = 100;
const FEED_MAX = 50;

const IS_LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
const API_BASE = IS_LOCAL ? "" : "https://mock-mes.onrender.com";
const WS_BASE = API_BASE
  ? API_BASE.replace(/^http/, "ws")
  : `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;

async function loadJoin() {
  try {
    const res = await fetch(`${API_BASE}/line/join`);
    if (!res.ok) return;
    const info = await res.json();
    document.getElementById("join-qr").src = info.qr;
    const link = document.getElementById("join-link");
    link.href = info.url;
    link.textContent = info.id;
    joinBtn.hidden = false;
  } catch {
    // no QR is fine: the button just stays hidden
  }
}
loadJoin();

async function gql(query, variables = {}) {
  const res = await fetch(`${API_BASE}/graphql`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, variables }),
  });
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

async function loadStats() {
  const data = await gql(`
    query {
      yieldByStation { station total passed }
      recentResults(limit: ${RECENT_N}) { station passed }
      topFailures(limit: 8) { station failCode count }
      alerts(limit: 5) { id station yieldRate threshold ts ackBy }
    }`);
  stations = {};
  for (const s of data.yieldByStation) {
    stations[s.station] = { total: s.total, passed: s.passed, recent: [] };
  }
  for (const r of data.recentResults) {
    (stations[r.station] ??= { total: 0, passed: 0, recent: [] }).recent = r.passed;
  }
  renderStations();
  renderFailures(data.topFailures);
  
  document.getElementById("alerts").replaceChildren();
  for (const a of data.alerts.reverse()) addAlert(a, false);

}

function level(rate) {
  if (rate >= 0.95) return "ok";
  if (rate >= 0.90) return "warn";
  return "bad";
}

function renderStations() {
  const box = document.getElementById("stations");
  box.replaceChildren();
  const mk = (cls, text) => {
    const d = document.createElement("div");
    d.className = cls;
    d.textContent = text;
    return d;
  };
  const pct = (x) => (x * 100).toFixed(1) + "%";
  for (const name of Object.keys(stations).sort()) {
    const { total, passed, recent } = stations[name];
    const totalRate = total ? passed / total : 1;
    const recentPassed = recent.filter(Boolean).length;
    const recentRate = recent.length ? recentPassed / recent.length : totalRate;
    const tile = document.createElement("div");
    tile.className = "tile " + level(recentRate);
    tile.append(
      mk("name", name),
      mk("label", T.recentLabel(recent.length)),
      mk("rate recent", pct(recentRate)),
      mk("count", `${recentPassed} / ${recent.length} pass`),
      mk("label split", T.totalLabel),
      mk("rate total", pct(totalRate)),
      mk("count", `${passed} / ${total} pass`),
    );
    box.append(tile);
  }
}

function renderFailures(rows) {
  const body = document.getElementById("failures");
  body.replaceChildren();
  for (const f of rows) {
    const tr = document.createElement("tr");
    for (const v of [f.station, f.failCode, f.count]) {
      const td = document.createElement("td"); td.textContent = v; tr.append(td);
    }
    body.append(tr);
  }
}

function addFeed(r) {
  const li = document.createElement("li");
  if (r.result === "fail") li.className = "fail";
  const time = new Date(r.ts).toLocaleTimeString(LOCALE);
  li.textContent = `${time}  ${r.station}  ${r.serial}  ${r.result}  ${r.fail_code ?? ""}`;
  const feed = document.getElementById("feed");
  feed.prepend(li);
  while (feed.children.length > FEED_MAX) feed.lastChild.remove();
}

const ALERT_MAX = 5;
function addAlert(a, isNew) {
  const li = document.createElement("li");
  if (isNew) li.className = "new"; 
  const time = new Date(a.ts).toLocaleTimeString(LOCALE);
  const rate = (a.yieldRate * 100).toFixed(1);
  const th = (a.threshold * 100).toFixed(0);
  li.dataset.id = a.id;
  li.dataset.text = T.alert(time, a.station, rate, th);
  li.textContent = li.dataset.text;
  if (a.ackBy) markAcked(li, a.ackBy);
  const box = document.getElementById("alerts");
  box.prepend(li);
  while (box.children.length > ALERT_MAX) box.lastChild.remove();
}

// someone pressed 認領 in LINE: turn the alert green and show who
function markAcked(li, name) {
  li.classList.remove("new");
  li.classList.add("acked");
  li.textContent = li.dataset.text + T.acked(name);
}

let retryDelay = 1000;
const MAX_RETRY_DELAY = 30000;

function connectWs() {
  const ws = new WebSocket(`${WS_BASE}/ws/dashboard`);
  const conn = document.getElementById("conn");

  ws.onopen = () => {
    retryDelay = 1000;
    conn.className = "on"; conn.textContent = T.online;
  };
  ws.onclose = () => {
    conn.className = "off"; conn.textContent = T.reconnecting;
    setTimeout(connectWs, Math.random() * retryDelay);
    retryDelay = Math.min(retryDelay * 2, MAX_RETRY_DELAY);
  };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "result") {
      const r = msg.data;
      const s = stations[r.station] ?? (stations[r.station] = { total: 0, passed: 0, recent: [] });
      s.total += 1;
      if (r.result === "pass") s.passed += 1;
      s.recent.push(r.result === "pass");
      if (s.recent.length > RECENT_N) s.recent.shift();
      renderStations();
      addFeed(r);
    } else if (msg.type === "alert") {
      const a = msg.data;
      addAlert({ id: a.id, station: a.station, yieldRate: a.yield_rate,
                 threshold: a.threshold, ts: a.ts, ackBy: a.ack_by }, true);
    } else if (msg.type === "ack") {
      const li = document.querySelector(`#alerts li[data-id="${CSS.escape(msg.data.id)}"]`);
      if (li) markAcked(li, msg.data.ack_by);
    }
  };
}

async function wakeUp() {
  const box = document.getElementById("wake");
  const secEl = document.getElementById("wake-sec");
  const t0 = Date.now();
  while (true) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 5000);
      const res = await fetch(`${API_BASE}/health`, { signal: ctl.signal });
      clearTimeout(timer);
      if (res.ok) { box.remove(); return; }
    } catch { /* not awake yet, keep waiting */ }
    secEl.textContent = Math.round((Date.now() - t0) / 1000);
    await new Promise((r) => setTimeout(r, 3000));
  }
}

wakeUp().then(() => {
  loadStats().catch(console.error);
  connectWs();
  setInterval(() => loadStats().catch(console.error), 30000);
});
</script>
</body>
</html>
