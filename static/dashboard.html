<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Line Monitor</title>
<style>
  :root {
    --bg: #14171a; --panel: #1d2125; --line: #2c3238; --text: #d9dee3;
    --muted: #7d8791; --ok: #3ecf6e; --warn: #f2b33d; --bad: #ef5350;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 18px 24px;
           border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  #conn { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  #lang { margin-left: auto; font-size: 13px; color: var(--muted); text-decoration: none;
          border: 1px solid var(--line); padding: 4px 10px;
          white-space: nowrap; flex-shrink: 0; }
  #lang:hover { color: var(--text); border-color: var(--muted); }
  #lang:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  #conn.on::before  { content: "● "; color: var(--ok); }
  #conn.off::before { content: "● "; color: var(--bad); }
  main { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; padding: 20px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: var(--muted); }

  #stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--muted);
          padding: 12px 14px; }
  .tile.ok   { border-top-color: var(--ok); }
  .tile.warn { border-top-color: var(--warn); }
  .tile.bad  { border-top-color: var(--bad); }
  .tile .name { font-family: var(--mono); color: var(--muted); }
  .tile .rate { font-family: var(--mono); font-size: 40px; font-weight: 700; line-height: 1.1; }
  .tile.bad .rate { color: var(--bad); }
  .tile .count { font-family: var(--mono); font-size: 13px; color: var(--muted); }

  section + section { margin-top: 24px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; }
  td, th { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  #feed { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 13px;
          max-height: 70vh; overflow-y: auto; }
  #feed li { padding: 4px 8px; border-bottom: 1px solid var(--line); }
  #feed li.fail { color: var(--bad); }

  #wake { position: fixed; inset: 0; z-index: 9; background: var(--bg);
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 14px; text-align: center; padding: 24px; }
  #wake h2 { margin: 0; font-size: 18px; color: var(--text); }
  #wake p { margin: 0; color: var(--muted); max-width: 420px; }
  #wake .bar { width: min(320px, 80vw); height: 4px; background: var(--line); overflow: hidden; }
  #wake .bar i { display: block; height: 100%; width: 40%; background: var(--ok);
                 animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  #wake .sec { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  #alerts { list-style: none; margin: 0 0 24px; padding: 0;
            max-height: 132px; overflow-y: auto; }
  #alerts:empty { display: none; }
  #alerts li { background: #3a1d1f; border-left: 4px solid var(--bad); color: #ffd6d6;
               padding: 8px 12px; margin-bottom: 6px; font-family: var(--mono); font-size: 14px; }
  #alerts li.new { animation: flash 1s 3; }
  @keyframes flash { 50% { background: #6b2226; } }
</style>
</head>
<body>
<div id="wake">
  <h2 data-t="waking"></h2>
  <div class="bar"><i></i></div>
  <p data-t="wakeNote"></p>
  <div class="sec"><span data-t="waited"></span> <span id="wake-sec">0</span> <span data-t="seconds"></span></div>
</div>
<header>
  <h1 data-t="title"></h1>
  <span id="conn" class="off" data-t="offline"></span>
  <a id="lang"></a>
</header>

<main>
  <div>
    <ul id="alerts"></ul>
    <section>
      <h2 data-t="yieldHead"></h2>
      <div id="stations"></div>
    </section>
    <section>
      <h2 data-t="failHead"></h2>
      <table>
        <thead><tr><th data-t="colStation"></th><th data-t="colCode"></th><th data-t="colCount"></th></tr></thead>
        <tbody id="failures"></tbody>
      </table>
    </section>
  </div>
  <section>
    <h2 data-t="feedHead"></h2>
    <ul id="feed"></ul>
  </section>
</main>

<script>
const LANG = location.pathname.endsWith("/en") ? "en" : "zh";
const LOCALE = LANG === "en" ? "en-US" : "zh-TW";

const TEXT = {
  zh: {
    pageTitle: "Line Monitor — 產線看板",
    title: "產線測試即時看板",
    online: "即時連線中",
    offline: "未連線",
    reconnecting: "斷線，重新連線中…",
    yieldHead: "各站良率（最近一週，即時更新）",
    failHead: "最常見失敗原因（最近一週，每 30 秒更新）",
    feedHead: "即時測試紀錄",
    colStation: "站",
    colCode: "失敗代碼",
    colCount: "次數",
    waking: "正在喚醒伺服器…",
    wakeNote: "這個 demo 跑在免費方案上，沒人使用時會自動休眠以節省資源。第一次開啟大約需要一分鐘。",
    waited: "已等待",
    seconds: "秒",
    other: "English",
    alert: (time, station, rate, th) =>
      `⚠ ${time}  ${station} 良率 ${rate}%，低於門檻 ${th}%`,
  },
  en: {
    pageTitle: "Line Monitor — Production Dashboard",
    title: "Production Test Monitor",
    online: "Live",
    offline: "Not connected",
    reconnecting: "Disconnected, reconnecting…",
    yieldHead: "Yield by station (last 7 days, live)",
    failHead: "Top failure codes (last 7 days, refreshed every 30s)",
    feedHead: "Live test results",
    colStation: "Station",
    colCode: "Fail code",
    colCount: "Count",
    waking: "Waking the server…",
    wakeNote: "This demo runs on a free plan and sleeps when nobody is using it. The first visit takes about a minute.",
    waited: "Waited",
    seconds: "s",
    other: "中文",
    alert: (time, station, rate, th) =>
      `⚠ ${time}  ${station} yield ${rate}%, below the ${th}% threshold`,
  },
};

const T = TEXT[LANG];

document.documentElement.lang = LANG === "en" ? "en" : "zh-Hant";
document.title = T.pageTitle;
for (const el of document.querySelectorAll("[data-t]")) {
  el.textContent = T[el.dataset.t];
}

const langLink = document.getElementById("lang");
langLink.textContent = T.other;
langLink.href = LANG === "en" ? "cn" : "en";
langLink.hreflang = LANG === "en" ? "zh-Hant" : "en";

let stations = {};
const FEED_MAX = 50;

const IS_LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
const API_BASE = IS_LOCAL ? "" : "https://mock-ems.onrender.com";
const WS_BASE = API_BASE
  ? API_BASE.replace(/^http/, "ws")
  : `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;

async function gql(query, variables = {}) {
  const res = await fetch(`${API_BASE}/graphql`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, variables }),
  });
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

async function loadStats() {
  const data = await gql(`
    query {
      yieldByStation { station total passed }
      topFailures(limit: 8) { station failCode count }
      alerts(limit: 5) { station yieldRate threshold ts }
    }`);
  stations = {};
  for (const s of data.yieldByStation) {
    stations[s.station] = { total: s.total, passed: s.passed };
  }
  renderStations();
  renderFailures(data.topFailures);
  
  document.getElementById("alerts").replaceChildren();
  for (const a of data.alerts.reverse()) addAlert(a, false);

}

function level(rate) {
  if (rate >= 0.95) return "ok";
  if (rate >= 0.90) return "warn";
  return "bad";
}

function renderStations() {
  const box = document.getElementById("stations");
  box.replaceChildren();
  for (const name of Object.keys(stations).sort()) {
    const { total, passed } = stations[name];
    const rate = total ? passed / total : 1;
    const tile = document.createElement("div");
    tile.className = "tile " + level(rate);
    const n = document.createElement("div"); n.className = "name"; n.textContent = name;
    const r = document.createElement("div"); r.className = "rate";
    r.textContent = (rate * 100).toFixed(1) + "%";
    const c = document.createElement("div"); c.className = "count";
    c.textContent = `${passed} / ${total} pass`;
    tile.append(n, r, c);
    box.append(tile);
  }
}

function renderFailures(rows) {
  const body = document.getElementById("failures");
  body.replaceChildren();
  for (const f of rows) {
    const tr = document.createElement("tr");
    for (const v of [f.station, f.failCode, f.count]) {
      const td = document.createElement("td"); td.textContent = v; tr.append(td);
    }
    body.append(tr);
  }
}

function addFeed(r) {
  const li = document.createElement("li");
  if (r.result === "fail") li.className = "fail";
  const time = new Date(r.ts).toLocaleTimeString(LOCALE);
  li.textContent = `${time}  ${r.station}  ${r.serial}  ${r.result}  ${r.fail_code ?? ""}`;
  const feed = document.getElementById("feed");
  feed.prepend(li);
  while (feed.children.length > FEED_MAX) feed.lastChild.remove();
}

const ALERT_MAX = 5;
function addAlert(a, isNew) {
  const li = document.createElement("li");
  if (isNew) li.className = "new"; 
  const time = new Date(a.ts).toLocaleTimeString(LOCALE);
  const rate = (a.yieldRate * 100).toFixed(1);
  const th = (a.threshold * 100).toFixed(0);
  li.textContent = T.alert(time, a.station, rate, th);
  const box = document.getElementById("alerts");
  box.prepend(li);
  while (box.children.length > ALERT_MAX) box.lastChild.remove();
}

let retryDelay = 1000;
const MAX_RETRY_DELAY = 30000;

function connectWs() {
  const ws = new WebSocket(`${WS_BASE}/ws/dashboard`);
  const conn = document.getElementById("conn");

  ws.onopen = () => {
    retryDelay = 1000;
    conn.className = "on"; conn.textContent = T.online;
  };
  ws.onclose = () => {
    conn.className = "off"; conn.textContent = T.reconnecting;
    setTimeout(connectWs, Math.random() * retryDelay);
    retryDelay = Math.min(retryDelay * 2, MAX_RETRY_DELAY);
  };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "result") {
      const r = msg.data;
      const s = stations[r.station] ?? (stations[r.station] = { total: 0, passed: 0 });
      s.total += 1;
      if (r.result === "pass") s.passed += 1;
      renderStations();
      addFeed(r);
    } else if (msg.type === "alert") {
      const a = msg.data;
      addAlert({ station: a.station, yieldRate: a.yield_rate,
                 threshold: a.threshold, ts: a.ts }, true);
    }
  };
}

async function wakeUp() {
  const box = document.getElementById("wake");
  const secEl = document.getElementById("wake-sec");
  const t0 = Date.now();
  while (true) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 5000);
      const res = await fetch(`${API_BASE}/health`, { signal: ctl.signal });
      clearTimeout(timer);
      if (res.ok) { box.remove(); return; }
    } catch { /* not awake yet, keep waiting */ }
    secEl.textContent = Math.round((Date.now() - t0) / 1000);
    await new Promise((r) => setTimeout(r, 3000));
  }
}

wakeUp().then(() => {
  loadStats().catch(console.error);
  connectWs();
  setInterval(() => loadStats().catch(console.error), 30000);
});
</script>
</body>
</html>
